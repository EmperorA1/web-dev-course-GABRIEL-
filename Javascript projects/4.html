<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <h1>Arguments</h1>
  <h2>Sum of Arguments</h2>
  <p>This project will show us how to sum arguments and math objects</p>
  <p id="a1"></p>
  <script>
    function sumAll() {
      var i;
      var sum = 0;
      for (i = 0; i < arguments.length; i++) {
        sum += arguments[i];
      }
      return sum;
    }
    document.getElementById("a1").innerHTML = sumAll(2 , 4, 6);

    var value =Math.sin(30);
    document.write("sin 30 is :"+ value +"<br>");
    
    var value1 =Math.cos(30);
    document.write("cos 30 is :"+ value1 +"<br>");
    var value2 =Math.tan(30);
    document.write("tan 30 is :"+ value2 +"<br>");
  </script>
</body>

</html>
