<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Joining Methods</h2>
    <P id="join1"></P>
    <p id="pop1"></p>
    <p id="2pop"></p>
    <script>
    var fruits = ["banana","orange","mango","pineapple"]

    document.getElementById("join1").innerHTML =fruits.join(" * ")
    document.getElementById("pop1").innerHTML =fruits.pop(" - ")
    document.getElementById("2pop").innerHTML =fruits.pop()
    </script>
</body>
</html>
