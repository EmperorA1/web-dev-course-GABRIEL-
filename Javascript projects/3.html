<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
<h1>Javascript</h1>
<h2>Javascript strings and Methods</h2>
  <p>Numbers from 1 to 9</p>
  <p id="result"></p>
  <script>
    var number = "";
    for (let i = 1; i <10; i++) {
      number += i + "<br>";
    }
    document.getElementById("result").innerHTML = number;
    document.getElementById("result").innerHTML += "The random value is " + Math.floor(Math.random() * 10) + "<br>";
    var date = new Date();
    document.getElementById("result").innerHTML += "Today's date is " + date.getDate();
  </script>
</body>

</html>
