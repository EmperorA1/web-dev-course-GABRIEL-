<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript project 1</title>
</head>
<body>
    <h1>Arithemetic calculations</h1>
    <h2>Simple Calculations</h2>
    <p>Here is a breakdown on how to perform simple calculations</p>
    <p id="Moon1">Addition</p>
    <p id="Moon2">subtraction</p>
    <p id="Moon3">Multiplication</p>
    <p id="Moon4">Division</p>
    <script>
     var num1 =30;
     var num2 =20;
     var add = num1+num2
     var sub = num1-num2
     var mul = num1*num2
     var div = num1/num2
     document.getElementById("Moon1").innerHTML ="The summed value is:"+add
     document.getElementById("Moon2").innerHTML ="The subtracted value is:"+sub
     document.getElementById("Moon3").innerHTML ="The multiplied value is:"+mul
     document.getElementById("Moon4").innerHTML ="The divided value is:"+div
    </script>
</body>
</html>
