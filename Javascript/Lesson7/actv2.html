<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditions and Statement</title>
</head>
<body>
    <p id="hour"></p>
    <p id="great"></p>
    <button type="button" onclick="myfunction()">Click Me!</button>
    <script>
    function myfunction(){
        var greating;
        var time =new Date().getHours();
        if(time < 12)
        greating = "good morning";
        else if(time<20)
        greating = "good day,";
        else greating ="good evening";
    document.getElementById("hour").innerHTML= time;
    document.getElementById("great").innerHTML=greating;
    }
    </script>
</body>
</html>
