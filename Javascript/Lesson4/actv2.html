<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Math Function</title>
</head>
<body>
    <P>These are math functions</P>
    <script>
        var value=Math.acos(-1);
        document.write(value+"<br>");
        var value=Math.random();
        document.write(value+"<br>");
        var value=Math.sqrt(16);
        document.write(value+"<br>");
    </script>
</body>
</html>
