<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arguments</title>
</head>
<body>
    <p id="a2"></p>
    <script>
        function find(){
        var max=0; for(i=0;i<arguments.length;i++){
        if(arguments[i]>max)
        max=arguments[i];
        }
        return max;
        }
        document.getElementById("a2").innerHTML=find(1,2,3,4,5,7,9,6);
    </script>
</body>
</html>
