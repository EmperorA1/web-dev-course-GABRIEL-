<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance</title>
</head>
<body>
    <p id="a1"></p>
    <script>
        class car{
            constructor(brand){
            this.carname= brand;
            }
            present(){
                return "I have a " + this.carname;
            }
        }
              class Model extends car{
                constructor( brand,model){
                    super(brand);
                    this.model=model;
                }
                show(){
                    return  this.present()+ "It is a" + this.model;
                }
              }
              let c = new Model("ford","Mustang");
              document.getElementById("a1").innerHTML=c.show();
    </script>
</body>
</html>
